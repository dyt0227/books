<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>书房 · 我的书架</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --bg-card: #1a1a1a;
    --bg-hover: #222;
    --text-primary: #fff;
    --text-secondary: #b3b3b3;
    --text-tertiary: #737373;
    --border: #2a2a2a;
    --primary: #E50914;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .header {
    padding: 60px 20px 32px;
    text-align: center;
    background: linear-gradient(180deg, rgba(229,9,20,0.08) 0%, transparent 70%);
  }
  .header-badge {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    color: var(--primary); border: 1px solid var(--primary);
    padding: 4px 14px; border-radius: 20px;
    letter-spacing: 2px; margin-bottom: 16px;
  }
  .header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px; font-weight: 700;
    margin-bottom: 8px;
  }
  .header-sub {
    font-size: 14px; color: var(--text-secondary);
  }

  .section { padding: 0 20px; margin-bottom: 32px; }
  .section-title {
    font-size: 13px; font-weight: 700;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
    padding-left: 4px;
  }

  .book-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (min-width: 480px) {
    .book-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .book-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .book-card:active {
    transform: scale(0.97);
  }
  .book-cover {
    aspect-ratio: 3/4;
    background: linear-gradient(135deg, #1a0a0a 0%, #2a1a1a 50%, #1a0a0a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .book-cover::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 30%, rgba(229,9,20,0.15) 0%, transparent 50%);
  }
  .book-cover-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px; font-weight: 700;
    line-height: 1.5;
    text-align: center;
    color: #fff;
    position: relative;
    z-index: 1;
  }
  .book-cover-tag {
    position: absolute;
    top: 10px; right: 10px;
    font-size: 9px; font-weight: 700;
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 1px;
  }
  .book-info {
    padding: 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .book-title {
    font-size: 14px; font-weight: 600;
    line-height: 1.4;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .book-author {
    font-size: 12px; color: var(--text-tertiary);
  }
  .book-meta {
    display: flex; gap: 10px; margin-top: 4px;
  }
  .book-meta-item {
    font-size: 11px; color: var(--text-tertiary);
    background: rgba(255,255,255,0.04);
    padding: 3px 8px;
    border-radius: 6px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
  }
  .empty-state svg {
    width: 48px; height: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }
  .empty-state p {
    font-size: 14px;
  }

  .footer {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-tertiary);
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">BOOKSHELF</div>
  <h1 class="header-title">我的书房</h1>
  <p class="header-sub">随时阅读，随时成长</p>
</div>

<div class="section">
  <div class="section-title">全部书籍</div>
  <div class="book-grid">

    <a href="netflix-culture/index.html" class="book-card">
      <div class="book-cover">
        <span class="book-cover-tag">管理</span>
        <div class="book-cover-text">奈飞文化手册</div>
      </div>
      <div class="book-info">
        <div class="book-title">奈飞文化手册</div>
        <div class="book-author">帕蒂·麦考德</div>
        <div class="book-meta">
          <span class="book-meta-item">11 章</span>
          <span class="book-meta-item">79 页</span>
        </div>
      </div>
    </a>

    <!-- 添加更多书籍时复制上方 book-card 结构 -->

  </div>
</div>

<div class="footer">
  书房 · 我的个人阅读空间
</div>

</body>
</html>
